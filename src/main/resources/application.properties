spring.application.name=demo-colas-azure

# Graceful Shutdown (Evita Pods zombies en Kubernetes al recibir SIGTERM)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Kubernetes Probes (Liveness & Readiness en Actuator)
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Grupo de Readiness (el probe que más frecuentemente se ejecuta en Kubernetes)
# Incluye el estado de la aplicación, PostgreSQL y Azure Service Bus
management.endpoint.health.group.readiness.include=readinessState,db,serviceBus

# Azure Service Bus - Input Queue (Lectura para el listener - Permiso Listen)
azure.servicebus.input.connection-string=${AZURE_SERVICEBUS_INPUT_CONNECTION_STRING}
azure.servicebus.input.queue-name=${AZURE_SERVICEBUS_INPUT_QUEUE_NAME:input-queue}

# Retención de bloqueo y reintentos en recepción (Consumer / Listener)
azure.servicebus.input.max-auto-lock-renew-duration=${AZURE_SERVICEBUS_MAX_AUTO_LOCK_RENEW_DURATION:5m}
azure.servicebus.input.max-delivery-count=${AZURE_SERVICEBUS_MAX_DELIVERY_COUNT:5}

# Azure Service Bus - Input Queue Sender (Escritura para pruebas REST - Permiso Send)
azure.servicebus.input.sender.connection-string=${AZURE_SERVICEBUS_INPUT_SENDER_CONNECTION_STRING:${azure.servicebus.input.connection-string}}

# Azure Service Bus - Output Queue (Escritura para reenvío - Permiso Send)
azure.servicebus.output.connection-string=${AZURE_SERVICEBUS_OUTPUT_CONNECTION_STRING}
azure.servicebus.output.queue-name=${AZURE_SERVICEBUS_OUTPUT_QUEUE_NAME:output-queue}

# Reintentos de transporte y conexión AMQP (Azure SDK para Senders y Processor)
azure.servicebus.retry.max-retries=${AZURE_SERVICEBUS_RETRY_MAX_RETRIES:3}
azure.servicebus.retry.delay=${AZURE_SERVICEBUS_RETRY_DELAY:1s}
azure.servicebus.retry.max-delay=${AZURE_SERVICEBUS_RETRY_MAX_DELAY:10s}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/demo_colas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# SQL Init
spring.sql.init.mode=always

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.example.demo_colas_azure=INFO
